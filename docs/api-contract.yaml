  "/api/bookings":
    "post":
      "operationId": "createBooking"
      "summary": "Tạo booking"
      "description": "GUEST cấm guestId kể cả null; FRONT_DESK bắt buộc guestId hợp lệ. Backend chốt giá/người tạo/trạng thái. READ_COMMITTED, khóa Room trước verify hold và kiểm tra giao nhau. Sau commit compare-delete best effort; cleanup lỗi không đổi booking thành thất bại. Không tự retry POST."
