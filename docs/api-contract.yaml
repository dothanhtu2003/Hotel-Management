        "401":
          "description": "401; UNAUTHENTICATED"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "403":
          "description": "403; ACCESS_DENIED; role/CSRF/chủ hold"
