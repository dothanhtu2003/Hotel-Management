        "400":
          "description": "400; VALIDATION_ERROR / dữ liệu không hợp lệ"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "401":
          "description": "401; UNAUTHENTICATED"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "403":
          "description": "403; ACCESS_DENIED; role/CSRF/chủ hold"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "500":
          "description": "500; INTERNAL_ERROR"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
    "get":
