      "summary": "Chủ hold giải phóng"
      "description": "Xóa nguyên tử có kiểm tra chủ/token. Đã xóa hoặc hết hạn trả 204; token còn tồn tại thuộc người khác trả 403. Không GET rồi DEL; 503 lúc release là đề xuất cần nhóm chốt."
      "x-owner": "M2"
      "x-roles":
        - "GUEST"
        - "FRONT_DESK"
      "tags":
        - "RoomHolds"
      "security":
        -
          "SessionCookie": []
          "CsrfToken": []
      "parameters":
        -
          "$ref": "#/components/parameters/holdToken"
      "responses":
