"openapi": "3.0.3"
"info":
  "title": "Hotel Reservation & Guest Service Management Platform — V1"
  "version": "1.0.0-draft"
  "description": "Hợp đồng mục tiêu, KHÔNG phải backend đã hoàn tất. Căn cứ Hotel_Project_Full_Plan_V1(1).md mục 5,7–12. M2 chưa có Controller/Service truy cập dữ liệu. x-owner phân công M2/M3; x-roles cần thực thi ở backend. Cookie name và mã lỗi framework/404 invoice/order còn chờ chốt tại docs/m2-decisions.md. Success DTO trực tiếp; danh sách wrapper; tiền VND chuỗi nguyên. Request unknown fields bị cấm trong hợp đồng; mapper hiện tại chưa bật strict toàn hệ thống, cần M3 thống nhất khi tích hợp."
"servers":
  - "url": "/"
    "description": "Cùng origin với frontend / reverse proxy; chưa publish backend."
"security":
  -
    "SessionCookie": []
"tags":
  -
    "name": "Rooms"
    "description": "Tìm và xem phòng công khai (M2)."
  -
    "name": "RoomHolds"
    "description": "API hold M2, thao tác Redis nguyên tử M3."
  -
    "name": "Bookings"
    "description": "Đặt, xem, hủy và nhận phòng (M2)."
  -
    "name": "Services"
    "description": "Danh mục và đơn dịch vụ trong kỳ ở (M2)."
  -
    "name": "Housekeeping"
    "description": "Trạng thái dọn phòng, không trả PII (M2)."
  -
    "name": "Billing"
    "description": "Preview, check-out và snapshot hóa đơn (M2)."
  -
    "name": "AuthGuest"
    "description": "Session, CSRF và hồ sơ khách do M3 sở hữu; chỉ đặc tả để tích hợp."
"paths":
  "/api/rooms/available":
    "get":
      "operationId": "findAvailableRooms"
      "summary": "Tìm phòng trống"
      "description": "Ngày nhận >= hôm nay Asia/Ho_Chi_Minh; ngày trả > ngày nhận. ACTIVE, capacity đủ; CONFIRMED/CHECKED_IN chặn [in,out). DIRTY vẫn xuất hiện. Không tải hold Redis. Sort id tăng; search không cam kết còn phòng."
      "x-owner": "M2"
      "x-roles":
        - "PUBLIC"
      "tags":
        - "Rooms"
      "security": []
      "parameters":
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/Size"
        -
          "name": "checkInDate"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "format": "date"
        -
          "name": "checkOutDate"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "format": "date"
        -
          "name": "guestCount"
          "in": "query"
          "required": true
          "schema":
            "type": "integer"
            "format": "int32"
            "minimum": 1
      "responses":
        "200":
          "description": "Thành công"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AvailableRoomPage"
        "400":
          "description": "400; VALIDATION_ERROR / dữ liệu không hợp lệ"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "500":
          "description": "500; INTERNAL_ERROR"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
