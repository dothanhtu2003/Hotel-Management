            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
"components":
  "securitySchemes":
    "SessionCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "JSESSIONID"
      "description": "Tên mặc định đề xuất, cần M3 xác nhận. HTTP session, HttpOnly, Secure khi HTTPS; không JWT."
    "CsrfToken":
      "type": "apiKey"
      "in": "header"
      "name": "X-CSRF-TOKEN"
      "description": "Lấy token và headerName từ GET /api/auth/csrf, lấy lại sau login/logout. Header này không thay phiên đăng nhập."
  "parameters":
    "Page":
      "name": "page"
      "in": "query"
      "schema":
        "type": "integer"
        "minimum": 0
        "default": 0
    "Size":
      "name": "size"
      "in": "query"
      "schema":
        "type": "integer"
        "minimum": 1
        "maximum": 100
        "default": 20
    "roomId":
      "name": "roomId"
      "in": "path"
      "required": true
      "schema":
        "$ref": "#/components/schemas/Id"
    "bookingId":
      "name": "bookingId"
      "in": "path"
      "required": true
      "schema":
        "$ref": "#/components/schemas/Id"
    "serviceOrderId":
      "name": "serviceOrderId"
      "in": "path"
      "required": true
      "schema":
        "$ref": "#/components/schemas/Id"
    "invoiceId":
      "name": "invoiceId"
      "in": "path"
      "required": true
      "schema":
        "$ref": "#/components/schemas/Id"
    "holdToken":
      "name": "holdToken"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "minLength": 1
      "description": "Access log phải che token."
  "schemas":
    "Money":
      "type": "string"
      "pattern": "^(0|[1-9][0-9]{0,17})$"
      "example": "1200000"
      "description": "VND nguyên, không dấu phân cách, không exponent; BigDecimal / DECIMAL(18,0)."
    "Id":
      "type": "integer"
      "format": "int64"
      "minimum": 1
      "maximum": 9007199254740991
    "Currency":
      "type": "string"
      "enum":
        - "VND"
    "Role":
      "type": "string"
      "enum":
        - "GUEST"
        - "FRONT_DESK"
        - "HOUSEKEEPING"
    "BookingStatus":
      "type": "string"
      "enum":
        - "CONFIRMED"
        - "CHECKED_IN"
        - "CHECKED_OUT"
        - "CANCELLED"
    "RoomStatus":
      "type": "string"
      "enum":
        - "ACTIVE"
        - "OUT_OF_SERVICE"
    "HousekeepingStatus":
      "type": "string"
      "enum":
        - "DIRTY"
        - "IN_PROGRESS"
        - "CLEAN"
    "ServiceOrderStatus":
      "type": "string"
      "enum":
        - "ORDERED"
        - "CANCELLED"
    "PaymentMethod":
      "type": "string"
      "enum":
        - "CASH"
    "PaymentStatus":
      "type": "string"
      "enum":
        - "PAID"
    "InvoiceItemType":
      "type": "string"
      "enum":
        - "ROOM"
        - "SERVICE"
    "ErrorCode":
      "type": "string"
      "enum":
        - "VALIDATION_ERROR"
        - "INVALID_DATE_RANGE"
        - "CHECK_IN_DATE_IN_PAST"
        - "ROOM_NOT_FOUND"
        - "ROOM_NOT_AVAILABLE"
        - "ROOM_OUT_OF_SERVICE"
        - "ROOM_NOT_CLEAN"
        - "CAPACITY_EXCEEDED"
        - "GUEST_NOT_FOUND"
        - "BOOKING_NOT_FOUND"
        - "INVALID_STATUS_TRANSITION"
        - "CHECK_IN_NOT_ALLOWED_TODAY"
        - "CANCELLATION_NOT_ALLOWED"
        - "CHECK_OUT_DATE_NOT_SUPPORTED"
        - "SERVICE_NOT_AVAILABLE"
        - "DUPLICATE_SERVICE_ITEM"
        - "BILL_CHANGED"
        - "EMAIL_ALREADY_EXISTS"
        - "UNAUTHENTICATED"
        - "ACCESS_DENIED"
        - "RESOURCE_BUSY"
        - "ROOM_ON_HOLD"
        - "HOLD_EXPIRED"
        - "INVALID_HOLD"
        - "HOLD_SERVICE_UNAVAILABLE"
        - "INTERNAL_ERROR"
    "FieldError":
      "type": "object"
      "required":
        - "field"
        - "message"
      "properties":
        "field":
          "type": "string"
        "message":
          "type": "string"
    "ApiError":
      "type": "object"
      "required":
        - "code"
        - "message"
        - "fieldErrors"
        - "details"
        - "timestamp"
      "properties":
