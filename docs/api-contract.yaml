      "description": "Không tạo tài khoản; không tự liên kết tài khoản theo email/phone."
      "x-owner": "M3"
      "x-roles":
        - "FRONT_DESK"
      "tags":
        - "AuthGuest"
      "security":
        -
          "SessionCookie": []
