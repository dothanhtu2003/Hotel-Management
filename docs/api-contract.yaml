        "details":
          "type": "object"
          "additionalProperties": true
          "description": "BILL_CHANGED có currentTotalAmount dạng Money; lỗi khác mặc định {}."
        "timestamp":
          "type": "string"
          "format": "date-time"
    "RoomResponse":
